<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acortador de URLs</title>
    <style>
        /* Estilos generales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #c850c0, #4158d0);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .formulario1, .formulario2 {
            width: 25%;
            padding-bottom: 24px;
        }

        h1, h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            color: #333;
        }

        input[type="url"],
        input[type="text"],
        input[type="password"],
        input[type="checkbox"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4158d0;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #303f9f;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
            color: #c7bfbf;
            text-align: center;
        }

        .table-container {
            width: 80%;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        .filter-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        /* Estilo para la ventana modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 80%;
            animation: slideDown 0.5s ease;
        }

        .modal-content h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .modal-content p {
            font-size: 16px;
            color: #555;
        }

        .modal-content .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .modal-content .success {
            color: #28a745;
        }

        .modal-content .error {
            color: #dc3545;
        }

        .modal-content button {
            margin-top: 15px;
            padding: 8px 20px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            background-color: #4158d0;
            color: white;
            cursor: pointer;
        }

        .modal-content button:hover {
            background-color: #303f9f;
        }

        /* Animación para la ventana modal */
        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Formulario de inicio de sesión -->
    <div class="formulario1">
        <h1>Iniciar sesión</h1>
        <form id="login-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Iniciar sesión</button>
        </form>
    </div>

    <!-- Formulario para acortar URLs -->
    <div class="formulario2">
        <h1>Acortador de URLs</h1>
        <form id="url-form">
            <label for="original-url">Ingresa la URL:</label>
            <input type="url" id="original-url" name="original_url" required>

            <label for="is-private">¿Privada?</label>
            <input type="checkbox" id="is-private" name="is_private">

            <button type="submit">Acortar URL</button>
        </form>

        <h2>Resultado:</h2>
        <p id="result"></p>
    </div>

    <!-- Tabla de URLs -->
    <div class="table-container" style="display:none;" id="urls-table-container">
        <div class="filter-container">
            <label for="filter-select">Filtrar:</label>
            <select id="filter-select">
                <option value="">Todas</option>
                <option value="public">Públicas</option>
                <option value="private">Privadas</option>
            </select>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>URL Original</th>
                    <th>URL Acortada</th>
                    <th>Visitas</th>
                </tr>
            </thead>
            <tbody id="urls-table-body"></tbody>
        </table>
    </div>

    <!-- Ventana modal -->
    <div id="modal" class="modal">
        <div class="modal-content" id="modal-content">
            <span id="modal-icon" class="icon"></span>
            <h3 id="modal-title"></h3>
            <p id="modal-message"></p>
            <button onclick="closeModal()">Aceptar</button>
        </div>
    </div>

    <script>
        let currentFilter = ''; // Variable para almacenar el filtro actual
    
        // Función para mostrar la ventana modal
        function showModal(icon, title, message, type = 'success') {
            const modal = document.getElementById('modal');
            const modalIcon = document.getElementById('modal-icon');
            const modalTitle = document.getElementById('modal-title');
            const modalMessage = document.getElementById('modal-message');
    
            modalIcon.innerHTML = icon;
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalIcon.className = `icon ${type}`;
    
            modal.style.display = 'flex';
        }
    
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    
        document.getElementById('login-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
    
            try {
                const response = await fetch('/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
    
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('authToken', data.token);
                    showModal('✅', 'Éxito', 'Inicio de sesión exitoso', 'success');
                    document.getElementById('urls-table-container').style.display = 'block';
                    fetchUrls(); // Cargar todas las URLs después de iniciar sesión
                } else {
                    showModal('❌', 'Error', `Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showModal('❌', 'Error', `Error: ${error.message}`, 'error');
            }
        });
    
        document.getElementById('url-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const originalUrl = document.getElementById('original-url').value;
            const isPrivate = document.getElementById('is-private').checked;
            const token = localStorage.getItem('authToken');
    
            if (!token) {
                showModal('❌', 'Error', 'Debes iniciar sesión primero.', 'error');
                return;
            }
    
            try {
                const response = await fetch('/urls/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${token}`
                    },
                    body: JSON.stringify({ original_url: originalUrl, is_private: isPrivate })
                });
    
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('result').innerHTML = `URL acortada: <a href="${data.shortened_url}" target="_blank">${data.shortened_url}</a>`;
                    showModal('✅', 'Éxito', 'URL acortada correctamente.', 'success');
                    fetchUrls(); // Actualizar la tabla después de acortar una URL
                } else {
                    showModal('❌', 'Error', `Error: ${data.error || 'No se pudo acortar la URL'}`, 'error');
                }
            } catch (error) {
                showModal('❌', 'Error', `Error: ${error.message}`, 'error');
            }
        });
    
        // Función para obtener y mostrar las URLs según el filtro actual
        async function fetchUrls() {
            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch(`/urls/?type=${currentFilter}`, {
                    method: 'GET',
                    headers: token ? { 'Authorization': `Token ${token}` } : {}
                });
    
                const data = await response.json();
                const tableBody = document.getElementById('urls-table-body');
                tableBody.innerHTML = '';
    
                data.forEach(url => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${url.id}</td>
                        <td><a href="${url.original_url}" target="_blank">${url.original_url}</a></td>
                        <td><a href="${url.shortened_url}" target="_blank">${url.shortened_url}</a></td>
                        <td>${url.view_count}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                showModal('❌', 'Error', 'Error al obtener las URLs.', 'error');
            }
        }
    
        // Evento para manejar el cambio en el select de filtros
        document.getElementById('filter-select').addEventListener('change', function () {
            currentFilter = this.value; // Actualizar el filtro actual
            fetchUrls(); // Actualizar la tabla según el filtro seleccionado
        });
    
        // Actualizar la tabla automáticamente cada 5 segundos
        setInterval(fetchUrls, 5000);
    </script>
</body>
</html>
